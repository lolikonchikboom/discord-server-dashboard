.qa{display:flex;flex-wrap:wrap;gap:8px}.qa button{padding:7px 13px;font-size:13px}
dialog h3{margin:18px 0 8px}
.rr{display:grid;grid-template-columns:1.3fr 1fr 2fr 76px 76px 44px;gap:8px;margin:8px 0;align-items:center}.rr button{padding:8px 0}

<script>
const CFG={client:'1569374837523222549',api:'https://bot-for-log.duckdns.org'};

let token=null,me=null,CH=[],RL=[];
(function(){try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){token=h.get('access_token');try{localStorage.setItem('tok',JSON.stringify({t:token,e:Date.now()+(+h.get('expires_in')||604800)*1000}))}catch{}history.replaceState(null,'',location.pathname)}
else{const s=JSON.parse(localStorage.getItem('tok')||'null');if(s&&s.e>Date.now())token=s.t}}catch{}})();

async function api(p,body){const r=await fetch(CFG.api+p,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
const d=await r.json().catch(()=>({}));if(r.status===401){logout()}if(!r.ok)throw new Error(d.error||('Помилка '+r.status));return d}

const T={message_create:['Повідомлення','b'],message_edit:['Редагування','y'],message_delete:['Видалено','r'],message_bulk_delete:['Масове видалення','r'],channel_create:['Канал створено','g'],channel_delete:['Канал видалено','r'],channel_update:['Канал змінено','y'],role_create:['Роль створено','g'],role_delete:['Роль видалено','r'],role_update:['Роль змінено','y'],member_join:['Вхід','g'],member_leave:['Вихід','y'],member_kick:['Кік','r'],member_ban:['Бан','r'],member_unban:['Розбан','g'],nickname_change:['Нікнейм','y'],member_roles:['Ролі','b'],member_timeout:['Таймаут','y'],voice_join:['Голос: вхід','g'],voice_leave:['Голос: вихід','y'],voice_move:['Голос: перехід','b'],spam_violation:['Спам','r'],automod_invite:['Автомод: запрошення','r'],automod_mentions:['Автомод: згадки','r'],automod_badword:['Автомод: слово','r'],bot_start:['Запуск бота','g']};
const tl=t=>T[t]||[t.startsWith('admin_')?'Дія: '+t.slice(6):t,t.startsWith('admin_')?'p':'b'];
function desc(e){const d=e.details||{},ch=e.channel_name?'#'+e.channel_name:'',tg=e.target_name||'';
switch(e.type){case'message_create':return ch+': '+(d.content||'')+((d.attachments||[]).length?'\n📎 '+d.attachments.join('\n'):'');
case'message_edit':return ch+'\nБуло: '+(d.before||'')+'\nСтало: '+(d.after||'');
case'message_delete':return ch+': '+(d.content||'(вміст невідомий)')+(d.deletedBy?'\nВидалив: '+d.deletedBy:'');
case'message_bulk_delete':return ch+': '+d.count+' повідомлень';
case'channel_create':case'channel_delete':return ch+' ('+(d.kind||'')+')';
case'channel_update':return d.from+' → '+d.to;
case'role_create':case'role_delete':return tg;
case'role_update':return tg+(d.nameFrom!==d.nameTo?' (раніше '+d.nameFrom+')':'')+(d.permissionsChanged?' · змінено права':'');
case'member_join':return'Акаунт створено '+new Date(d.accountCreated).toLocaleDateString('uk-UA');
case'member_leave':return'';
case'member_kick':case'member_ban':case'member_unban':return tg+(d.reason?' · '+d.reason:'');
case'nickname_change':return tg+': '+(d.from||'—')+' → '+(d.to||'—');
case'member_roles':return tg+': '+((d.added||[]).length?'+'+d.added.join(', ')+' ':'')+((d.removed||[]).length?'−'+d.removed.join(', '):'');
case'member_timeout':return tg+(d.until?' до '+new Date(d.until).toLocaleString('uk-UA'):' · знято');
case'voice_join':case'voice_leave':return ch;case'voice_move':return d.from+' → '+d.to;

case'bot_start':return'';}
const o={...d};delete o.via;return[tg,ch,Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · ')].filter(Boolean).join(' · ')}
function evRow(e){const[l,c]=tl(e.type);const av=e.actor_avatar?`<img class=av src="${esc(e.actor_avatar)}" loading=lazy alt="">`:`<div class=av>${esc((e.actor_name||'?')[0])}</div>`;
return`<div class=ev>${av}<div class=t><div class=h><a data-uid="${esc(e.actor_id||'')}">${esc(e.actor_name||(e.actor_id?'ID '+e.actor_id:'Система / невідомо'))}</a><span class="bg ${c}">${esc(l)}</span><span class=m>${new Date(e.ts).toLocaleString('uk-UA')}</span></div><div class=x>${esc(desc(e))}</div></div></div>`}
async function showEvents(box,p,more){const q=new URLSearchParams({limit:50,...p});if(more&&box.dataset.last)q.set('before',box.dataset.last);
const d=await api('/api/events?'+q);if(!more)box.innerHTML='';box.insertAdjacentHTML('beforeend',d.map(evRow).join('')||(more?'':'<p class=m style="padding:16px">Подій не знайдено</p>'));if(d.length)box.dataset.last=d[d.length-1].id;return d.length}
document.addEventListener('click',e=>{const a=e.target.closest('[data-uid]');if(a&&a.dataset.uid)profile(a.dataset.uid)});

i.addEventListener('input',()=>{clearTimeout(t);if(i.value.length<2||i.value.includes('·')){w.classList.remove('open');return}t=setTimeout(async()=>{try{const m=await api('/api/members?q='+encodeURIComponent(i.value));ol.innerHTML=m.length?'':'<div class=emp>Нікого не знайдено</div>';m.forEach(x=>{const d=document.createElement('div');d.className='op';d.innerHTML='<img class=av style="width:30px;height:30px" src="'+esc(x.avatar)+'" alt=""><span>'+esc(x.name)+' <small class=m>@'+esc(x.username)+'</small></span>';d.onclick=()=>{i.value=x.name+' · '+x.id;w.classList.remove('open')};ol.appendChild(d)});w.classList.add('open')}catch{}},300)})}

$('#b4').onclick=async()=>{const k=$('#ma').value,a=AC[k],u=pid('mu');if(a.need&&!u)return toast('Оберіть учасника зі списку або вставте його ID',1);
const b={};if(u)b.userId=u;a.f.forEach(f=>b[f[0]]=val(f,'f_'));let name=k;
if(k==='untimeout'){name='timeout';b.seconds=0}
if(k==='timeout'){if(!b.dur)return toast('Вкажіть тривалість таймауту',1);b.seconds=b.dur}
if(k==='ban'){b.durationSec=b.dur;b.deleteSeconds=+b.del}
if(k==='roleGive'){name='roleAdd';b.durationSec=b.dur}
if((k==='roleGive'||k==='roleRemove')&&!b.roleId)return toast('Оберіть роль',1);
if(k==='roleCreate'&&!b.name.trim())return toast('Вкажіть назву ролі',1);
await run(name,b,a.ask);if(k==='roleCreate'){RL=await api('/api/roles');draw()}}}
async function act(n,b,ask){if(ask&&!confirm(ask))return false;try{await api('/api/actions/'+n,b);toast('Готово');return true}catch(e){toast(e.message,1);return false}}
async function profile(id){const d=$('#dlg');if(!d.open)d.showModal();if(!d.innerHTML.includes('data-q'))d.innerHTML='<p class=m style="padding:20px">Завантаження…</p>';
try{const m=await api('/api/members/'+id),s=m.stats,now=Date.now();
const days=[...Array(14)].map((_,i)=>{const t=new Date(now-(13-i)*864e5).toISOString().slice(0,10);return[t,(m.activity.find(a=>a.d===t)||{c:0}).c]}),mx=Math.max(1,...days.map(x=>x[1]));
const age=m.createdAt?Math.floor((now-new Date(m.createdAt))/864e5):0;
const q=(k,l,c)=>`<button class="${c||'s'}" data-q=${k}>${l}</button>`;
const lst=(a,f)=>a.length?a.map(f).join(''):'<p class=m style="margin:6px 0">Поки нічого</p>';
const row=(x,t)=>`<div class=ev style="padding:8px 4px"><div class=t><span class=m>${new Date(x.ts).toLocaleString('uk-UA')} · ${esc(x.by_name)}</span><div class=x>${esc(t)}</div></div></div>`;
d.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><img class=av style="width:72px;height:72px" src="${esc(m.avatar)}" alt=""><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(m.name)}</h2><span class=m>@${esc(m.username||'')} · ID ${m.id}</span></div><button class=s onclick="$('#dlg').close()">Закрити</button></div>
<p>${m.bot?'<span class="bg b">БОТ</span> ':''}<span class="bg ${age<7?'y':'g'}">Акаунту ${age} дн.</span> ${m.voice?'<span class="bg b">🔊 '+esc(m.voice)+'</span> ':''}${m.warns.length?'<span class="bg r">Попереджень: '+m.warns.length+'</span> ':''}${m.timeoutUntil?'<span class="bg y">Таймаут до '+new Date(m.timeoutUntil).toLocaleString('uk-UA')+'</span>':''}</p>
<p class=m>${m.joinedAt?'На сервері з '+new Date(m.joinedAt).toLocaleDateString('uk-UA'):'Не на сервері'}</p>
<p>${(m.roles||[]).map(r=>`<span class=chip style="border-color:${r.color}">${esc(r.name)}</span>`).join('')||'<span class=m>Без ролей</span>'}</p>
<div class=grid>${[[s.messages,'Повідомлень'],[s.edits,'Редагувань'],[s.deletes,'Видалень'],[s.violations,'Порушень']].map(x=>`<div class=card><b>${x[0]}</b><span class=m>${x[1]}</span></div>`).join('')}</div>
<h3>Активність за 14 днів</h3><div class=act>${days.map(x=>`<i style="height:${Math.max(4,x[1]/mx*64)}px" title="${x[0]}: ${x[1]}"></i>`).join('')}</div><p class=m>Найактивніші канали: ${m.topChannels.map(c=>'#'+esc(c.n)+' ('+c.c+')').join(', ')||'—'}</p>
<h3>Швидкі дії</h3><div class=qa>${q('t5','Таймаут 5 хв')}${q('t60','Таймаут 1 год')}${q('t1d','Таймаут 1 доба')}${q('ut','Зняти таймаут')}${q('warn','Попередження')}${q('dm','Написати в ЛС')}${q('vk','З голосового')}${q('kick','Кік','d')}${q('ban','Бан','d')}${q('copy','Копіювати ID')}<a href="https://discord.com/users/${m.id}" target=_blank rel=noopener><button class=s>Відкрити в Discord</button></a></div>
<div class=bar style="margin-top:12px"><select id=pr>${RL.map(r=>`<option value=${r.id}>${esc(r.name)}</option>`).join('')}</select><button data-q=ra>Видати роль</button><button class=s data-q=rr>Забрати роль</button></div>
<div class=bar><input id=pn placeholder="Новий нікнейм"><button class=s data-q=nick>Змінити нікнейм</button></div>
<h3>Попередження ${m.warns.length?'<button class=s data-q=wc style="float:right;padding:5px 12px;font-size:12px">Очистити</button>':''}</h3>${lst(m.warns,w=>row(w,w.reason))}
<h3>Нотатки адмінів</h3>${lst(m.notes,w=>row(w,w.text))}<div class=bar style="margin-top:8px"><input id=pt placeholder="Нова нотатка (бачать лише адміни)"><button class=s data-q=note>Додати</button></div>
<h3>Остання активність</h3><div class=list style="max-height:320px;overflow:auto">${m.events.map(evRow).join('')||'<p class=m style="padding:12px">Немає подій</p>'}</div>`;
const go_=async(n,b,ask)=>{if(await act(n,b,ask))profile(id)},R=(n,x)=>go_(n,{userId:id,...x});
const H={t5:()=>R('timeout',{seconds:300}),t60:()=>R('timeout',{seconds:3600}),t1d:()=>R('timeout',{seconds:86400}),ut:()=>R('timeout',{seconds:0}),
warn:()=>{const r=prompt('Причина попередження?');if(r!==null)R('warn',{reason:r,notify:true})},
dm:()=>{const t=prompt('Текст повідомлення в ЛС від імені бота:');if(t)R('dm',{content:t})},
vk:()=>R('voiceKick',{}),
kick:()=>{const r=prompt('Причина кіку? (можна залишити порожнім)');if(r!==null)go_('kick',{userId:id,reason:r},'Вигнати '+m.name+'?')},
ban:()=>{const r=prompt('Причина бану? (можна залишити порожнім)');if(r!==null)go_('ban',{userId:id,reason:r},'Забанити '+m.name+'?')},
copy:()=>navigator.clipboard.writeText(id).then(()=>toast('ID скопійовано')),
ra:()=>$('#pr').value&&R('roleAdd',{roleId:$('#pr').value}),rr:()=>$('#pr').value&&R('roleRemove',{roleId:$('#pr').value}),
nick:()=>R('nickname',{nickname:$('#pn').value}),note:()=>$('#pt').value.trim()&&R('note',{text:$('#pt').value}),
wc:()=>go_('warnClear',{userId:id},'Очистити всі попередження?')};
d.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>H[b.dataset.q]())}
catch(e){d.innerHTML='<p>'+esc(e.message)+'</p><button onclick="$(\'#dlg\').close()">Закрити</button>'}}
const KINDS=[['react','Реакція (емодзі)'],['text','Текстова відповідь'],['gif','Гіфка'],['emoji','Емодзі сервера у відповіді']];
const rowH=r=>`<div class=rr><input class=rw placeholder="слова-тригери через кому" value="${esc(r.words)}"><select class=rk>${KINDS.map(k=>`<option value=${k[0]}${r.kind===k[0]?' selected':''}>${k[1]}</option>`).join('')}</select><input class=rv placeholder="значення" value="${esc(r.value)}"><input class=rc type=number min=1 max=100 value="${r.chance}" title="Шанс, %"><input class=rd type=number min=0 value="${r.cooldown}" title="Пауза, с"><button class=d data-rm title="Видалити правило">✕</button></div>`;
const rules=()=>[...document.querySelectorAll('.rr')].map(r=>({words:r.querySelector('.rw').value,kind:r.querySelector('.rk').value,value:r.querySelector('.rv').value,chance:+r.querySelector('.rc').value,cooldown:+r.querySelector('.rd').value}));
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));V[v]().catch(e=>toast(e.message,1))}
async function start(){const root=$('#root');
if(!token){root.innerHTML=`<div class=login><div class=card><h2>Панель керування сервером</h2><p class=m>Увійдіть через Discord. Доступ мають лише дозволені акаунти.</p><a href="${loginUrl()}"><button>Увійти через Discord</button></a></div></div>`;return}
try{me=await api('/api/me')}catch(e){root.innerHTML=`<div class=login><div class=card><h2>Немає доступу</h2><p class=m>${esc(e.message)}</p><button onclick="logout()">Вийти</button></div></div>`;return}
const s=await api('/api/stats');[CH,RL]=await Promise.all([api('/api/channels'),api('/api/roles')]);
root.innerHTML=`<div id=app><aside><h2>${s.guild.icon?`<img src="${esc(s.guild.icon)}" alt="">`:''}${esc(s.guild.name)}</h2><nav>${[['overview','Огляд'],['log','Журнал'],['members','Учасники'],['spam','Антиспам'],['control','Керування'],['settings','Налаштування']].map(([k,l])=>`<button data-v=${k}>${l}</button>`).join('')}</nav><div class=me><img src="${esc(me.avatar||'')}" alt=""><div><b>${esc(me.name)}</b><br><a href="#" onclick="logout();return false">Вийти</a> <span class=m style="font-size:11px">· v6</span></div></div></aside><main id=main></main></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));go('overview')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),x=document.createElement('span');x.className='rip';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';b.appendChild(x);setTimeout(()=>x.remove(),650)});
new MutationObserver(()=>document.querySelectorAll('.grid .card b:not([data-c])').forEach(b=>{b.dataset.c=1;const t=+b.textContent;if(!(t>0))return;const s=performance.now();(function f(n){const p=Math.min((n-s)/900,1);b.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})).observe(document.body,{childList:true,subtree:true});
function enhance(s){if(s.dataset.e)return;s.dataset.e=1;s.style.display='none';const multi=s.multiple,w=document.createElement('div');w.className='dd';s.after(w);w.appendChild(s);
const dt=document.createElement('div');dt.className='dt';dt.tabIndex=0;dt.innerHTML='<span></span><svg width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="#8b93a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const opts=[...s.options],pn=document.createElement('div');pn.className='pn';pn.innerHTML=(opts.length>7?'<input placeholder="Пошук…">':'')+'<div class=ol></div>';w.append(dt,pn);
const ol=pn.querySelector('.ol'),inp=pn.querySelector('input'),lab=dt.firstChild;
const text=()=>{const sel=opts.filter(o=>o.selected&&o.value);lab.textContent=multi?(sel.length?'Обрано: '+sel.length:'Нічого не обрано'):(opts.find(o=>o.selected)?.textContent||'—');dt.classList.toggle('mu',multi?!sel.length:!s.value)};
const draw=()=>{const f=(inp?.value||'').toLowerCase(),list=opts.filter(o=>o.textContent.toLowerCase().includes(f));ol.innerHTML=list.length?'':'<div class=emp>Нічого не знайдено</div>';
list.forEach(o=>{const d=document.createElement('div');d.className='op'+(o.selected?' on':'');d.innerHTML=(multi?'<i class=ck></i>':'')+'<span></span>';d.lastChild.textContent=o.textContent;
d.onclick=()=>{if(multi){o.selected=!o.selected;d.classList.toggle('on',o.selected)}else{s.value=o.value;w.classList.remove('open')}text();s.dispatchEvent(new Event('change',{bubbles:true}))};ol.appendChild(d)})};
dt.onclick=()=>{document.querySelectorAll('.dd.open').forEach(x=>x!==w&&x.classList.remove('open'));const o=w.classList.toggle('open');if(o){if(inp)inp.value='';draw();inp&&setTimeout(()=>inp.focus(),30)}};
inp&&inp.addEventListener('input',draw);dt.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dt.click()}if(e.key==='Escape')w.classList.remove('open')};text()}
document.addEventListener('click',e=>{document.querySelectorAll('.dd.open').forEach(x=>{if(!x.contains(e.target))x.classList.remove('open')})});
new MutationObserver(()=>document.querySelectorAll('select:not([data-e])').forEach(enhance)).observe(document.body,{childList:true,subtree:true});
start();
</script>
