<style>

a{color:var(--ac)}.m{color:var(--mu)}button,input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}

@media(max-width:760px){#app{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}nav{display:flex;flex-wrap:wrap}.me{margin:0 0 0 auto}main{padding:14px}}
/* ===== Візуал і анімації ===== */
:root{--ac2:#8b5cf6;--glow:0 0 0 3px #5865f244;--ease:cubic-bezier(.34,1.56,.64,1)}

label{cursor:pointer}

.card{transition:transform .3s var(--ease),border-color .25s,box-shadow .3s}

.grid .card b{background:linear-gradient(135deg,#fff,#a5adff);-webkit-background-clip:text;background-clip:text;color:transparent}

.ev{transition:background .25s,padding-left .25s}.ev:hover{background:#ffffff08;padding-left:18px}

.bg{transition:transform .2s var(--ease)}.ev:hover .bg{transform:scale(1.06)}
a{transition:opacity .2s}a:hover{opacity:.8}

dialog[open]{animation:pop .35s var(--ease)}dialog::backdrop{backdrop-filter:blur(5px);animation:fade .3s}
#toast{animation:slide .4s var(--ease);box-shadow:0 12px 30px #0008;border-radius:12px;font-weight:600}
.login .card{animation:pop .7s var(--ease);box-shadow:0 20px 60px #0008,0 0 60px #5865f233}
.login .card h2{animation:float 4s ease-in-out infinite}
:root{color-scheme:dark}
label:has(input[type=checkbox]){padding:6px 8px;margin:0 -8px;border-radius:10px;transition:background .2s}
label:has(input[type=checkbox]):hover{background:#ffffff0a}
.dd{position:relative;flex:1 1 140px;min-width:0}.dd>input{width:100%}
.dd .dt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:9px 12px;background:var(--p2);border:1px solid var(--bd);border-radius:10px;cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .25s,background .25s}
.dd .dt:hover{border-color:#3d4557;background:#232836}
.dd.open .dt,.dd .dt:focus-visible{outline:0;border-color:var(--ac);box-shadow:var(--glow)}
.dd .dt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dd .dt.mu span{color:var(--mu)}
.dd .dt svg{flex:none;transition:transform .35s var(--ease)}.dd.open .dt svg{transform:rotate(180deg)}
.dd .pn{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;display:none;padding:6px;background:#1a1e27;border:1px solid #333a4a;border-radius:14px;box-shadow:0 20px 50px #000b,0 0 0 1px #5865f222;transform-origin:top center}
.dd.open .pn{display:block;animation:ddin .25s var(--ease)}
@keyframes ddin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.dd .pn>input{width:100%;margin-bottom:6px}
.dd .ol{max-height:260px;overflow:auto;padding-right:2px}
.dd .op{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;transition:background .15s,padding-left .2s}
.dd .op:hover{background:#ffffff12;padding-left:15px}
.dd .op.on{background:linear-gradient(135deg,#5865f245,#8b5cf630);color:#fff}
.dd .op span{overflow:hidden;text-overflow:ellipsis}
.dd .op .ck{width:18px;height:18px;border-radius:6px;border:2px solid #4a5163;flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.dd .op.on .ck{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.dd .op .ck::after{content:"";width:5px;height:9px;margin-top:-2px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--ease)}
.dd .op.on .ck::after{transform:rotate(45deg) scale(1)}
.dd .emp{padding:12px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>

<body>

<script>
const CFG={client:'1569374837523222549',api:'https://bot-for-log.duckdns.org'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=null,me=null,CH=[],RL=[];
(function(){try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){token=h.get('access_token');try{localStorage.setItem('tok',JSON.stringify({t:token,e:Date.now()+(+h.get('expires_in')||604800)*1000}))}catch{}history.replaceState(null,'',location.pathname)}
else{const s=JSON.parse(localStorage.getItem('tok')||'null');if(s&&s.e>Date.now())token=s.t}}catch{}})();
function logout(){try{localStorage.removeItem('tok')}catch{}token=null;location.reload()}
function loginUrl(){return'https://discord.com/api/oauth2/authorize?client_id='+CFG.client+'&response_type=token&scope=identify&redirect_uri='+encodeURIComponent(location.origin+location.pathname)}
async function api(p,body){const r=await fetch(CFG.api+p,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
const d=await r.json().catch(()=>({}));if(r.status===401){logout()}if(!r.ok)throw new Error(d.error||('Помилка '+r.status));return d}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.background=bad?'var(--r)':'var(--g)';e.style.display='block';setTimeout(()=>e.style.display='none',3500)}

const T={message_create:['Повідомлення','b'],message_edit:['Редагування','y'],message_delete:['Видалено','r'],message_bulk_delete:['Масове видалення','r'],channel_create:['Канал створено','g'],channel_delete:['Канал видалено','r'],channel_update:['Канал змінено','y'],role_create:['Роль створено','g'],role_delete:['Роль видалено','r'],role_update:['Роль змінено','y'],member_join:['Вхід','g'],member_leave:['Вихід','y'],member_kick:['Кік','r'],member_ban:['Бан','r'],member_unban:['Розбан','g'],nickname_change:['Нікнейм','y'],member_roles:['Ролі','b'],member_timeout:['Таймаут','y'],voice_join:['Голос: вхід','g'],voice_leave:['Голос: вихід','y'],voice_move:['Голос: перехід','b'],spam_violation:['Спам','r'],automod_invite:['Автомод: запрошення','r'],automod_mentions:['Автомод: згадки','r'],automod_badword:['Автомод: слово','r'],bot_start:['Запуск бота','g']};
const tl=t=>T[t]||[t.startsWith('admin_')?'Дія: '+t.slice(6):t,t.startsWith('admin_')?'p':'b'];
function desc(e){const d=e.details||{},ch=e.channel_name?'#'+e.channel_name:'',tg=e.target_name||'';
switch(e.type){case'message_create':return ch+': '+(d.content||'')+((d.attachments||[]).length?'\n📎 '+d.attachments.join('\n'):'');
case'message_edit':return ch+'\nБуло: '+(d.before||'')+'\nСтало: '+(d.after||'');
case'message_delete':return ch+': '+(d.content||'(вміст невідомий)')+(d.deletedBy?'\nВидалив: '+d.deletedBy:'');
case'message_bulk_delete':return ch+': '+d.count+' повідомлень';
case'channel_create':case'channel_delete':return ch+' ('+(d.kind||'')+')';
case'channel_update':return d.from+' → '+d.to;
case'role_create':case'role_delete':return tg;
case'role_update':return tg+(d.nameFrom!==d.nameTo?' (раніше '+d.nameFrom+')':'')+(d.permissionsChanged?' · змінено права':'');
case'member_join':return'Акаунт створено '+new Date(d.accountCreated).toLocaleDateString('uk-UA');
case'member_leave':return'';
case'member_kick':case'member_ban':case'member_unban':return tg+(d.reason?' · '+d.reason:'');
case'nickname_change':return tg+': '+(d.from||'—')+' → '+(d.to||'—');
case'member_roles':return tg+': '+((d.added||[]).length?'+'+d.added.join(', ')+' ':'')+((d.removed||[]).length?'−'+d.removed.join(', '):'');
case'member_timeout':return tg+(d.until?' до '+new Date(d.until).toLocaleString('uk-UA'):' · знято');
case'voice_join':case'voice_leave':return ch;case'voice_move':return d.from+' → '+d.to;
case'spam_violation':return d.messages+' повідомлень за '+d.windowSec+' с · '+d.action+(ch?' · '+ch:'');
case'bot_start':return'';}
const o={...d};delete o.via;return[tg,ch,Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · ')].filter(Boolean).join(' · ')}
function evRow(e){const[l,c]=tl(e.type);const av=e.actor_avatar?`<img class=av src="${esc(e.actor_avatar)}" loading=lazy alt="">`:`<div class=av>${esc((e.actor_name||'?')[0])}</div>`;
return`<div class=ev>${av}<div class=t><div class=h><a data-uid="${esc(e.actor_id||'')}">${esc(e.actor_name||(e.actor_id?'ID '+e.actor_id:'Система / невідомо'))}</a><span class="bg ${c}">${esc(l)}</span><span class=m>${new Date(e.ts).toLocaleString('uk-UA')}</span></div><div class=x>${esc(desc(e))}</div></div></div>`}
async function showEvents(box,p,more){const q=new URLSearchParams({limit:50,...p});if(more&&box.dataset.last)q.set('before',box.dataset.last);
const d=await api('/api/events?'+q);if(!more)box.innerHTML='';box.insertAdjacentHTML('beforeend',d.map(evRow).join('')||(more?'':'<p class=m style="padding:16px">Подій не знайдено</p>'));if(d.length)box.dataset.last=d[d.length-1].id;return d.length}
document.addEventListener('click',e=>{const a=e.target.closest('[data-uid]');if(a&&a.dataset.uid)profile(a.dataset.uid)});

const picker=id=>`<input id=${id} list=${id}L placeholder="Користувач (ім’я або ID)" autocomplete=off><datalist id=${id}L></datalist>`;
function bindPicker(id){const i=$('#'+id),l=$('#'+id+'L');l&&l.remove();i.removeAttribute('list');const w=document.createElement('div');w.className='dd';i.before(w);w.appendChild(i);const pn=document.createElement('div');pn.className='pn';pn.innerHTML='<div class=ol></div>';w.appendChild(pn);const ol=pn.firstChild;let t;
i.addEventListener('input',()=>{clearTimeout(t);if(i.value.length<2||i.value.includes('·')){w.classList.remove('open');return}t=setTimeout(async()=>{try{const m=await api('/api/members?q='+encodeURIComponent(i.value));ol.innerHTML=m.length?'':'<div class=emp>Нікого не знайдено</div>';m.forEach(x=>{const d=document.createElement('div');d.className='op';d.innerHTML='<img class=av style="width:30px;height:30px" src="'+esc(x.avatar)+'" alt=""><span>'+esc(x.name)+' <small class=m>@'+esc(x.username)+'</small></span>';d.onclick=()=>{i.value=x.name+' · '+x.id;w.classList.remove('open')};ol.appendChild(d)});w.classList.add('open')}catch{}},300)})}
const pid=id=>{const v=$('#'+id).value.trim();return v.includes('·')?v.split('·').pop().trim():(/^\d{15,}$/.test(v)?v:'')};
const chOpts=(txt)=>CH.filter(c=>!txt||c.text).map(c=>`<option value="${c.id}">#${esc(c.name)}</option>`).join('');
const main=h=>{$('#main').innerHTML=h};

const V={
async overview(){const s=await api('/api/stats');const c=(n,l)=>`<div class=card><b>${n}</b><span class=m>${l}</span></div>`;
main(`<h1>Огляд</h1><div class=grid>${c(s.members,'Учасників')}${c(s.channels,'Каналів')}${c(s.roles,'Ролей')}${c(s.events24h,'Подій за 24 год')}${c(s.events,'Подій усього')}${c(s.violations,'Порушень')}</div>

function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));V[v]().catch(e=>toast(e.message,1))}
async function start(){const root=$('#root');
if(!token){root.innerHTML=`<div class=login><div class=card><h2>Панель керування сервером</h2><p class=m>Увійдіть через Discord. Доступ мають лише дозволені акаунти.</p><a href="${loginUrl()}"><button>Увійти через Discord</button></a></div></div>`;return}

const s=await api('/api/stats');[CH,RL]=await Promise.all([api('/api/channels'),api('/api/roles')]);
root.innerHTML=`<div id=app><aside><h2>${s.guild.icon?`<img src="${esc(s.guild.icon)}" alt="">`:''}${esc(s.guild.name)}</h2><nav>${[['overview','Огляд'],['log','Журнал'],['members','Учасники'],['spam','Антиспам'],['control','Керування'],['settings','Налаштування']].map(([k,l])=>`<button data-v=${k}>${l}</button>`).join('')}</nav><div class=me><img src="${esc(me.avatar||'')}" alt=""><div><b>${esc(me.name)}</b><br><a href="#" onclick="logout();return false">Вийти</a> <span class=m style="font-size:11px">· v3</span></div></div></aside><main id=main></main></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));go('overview')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),x=document.createElement('span');x.className='rip';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';b.appendChild(x);setTimeout(()=>x.remove(),650)});
new MutationObserver(()=>document.querySelectorAll('.grid .card b:not([data-c])').forEach(b=>{b.dataset.c=1;const t=+b.textContent;if(!(t>0))return;const s=performance.now();(function f(n){const p=Math.min((n-s)/900,1);b.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)})).observe(document.body,{childList:true,subtree:true});
function enhance(s){if(s.dataset.e)return;s.dataset.e=1;s.style.display='none';const multi=s.multiple,w=document.createElement('div');w.className='dd';s.after(w);w.appendChild(s);

const ol=pn.querySelector('.ol'),inp=pn.querySelector('input'),lab=dt.firstChild;
const text=()=>{const sel=opts.filter(o=>o.selected&&o.value);lab.textContent=multi?(sel.length?'Обрано: '+sel.length:'Нічого не обрано'):(opts.find(o=>o.selected)?.textContent||'—');dt.classList.toggle('mu',multi?!sel.length:!s.value)};
const draw=()=>{const f=(inp?.value||'').toLowerCase(),list=opts.filter(o=>o.textContent.toLowerCase().includes(f));ol.innerHTML=list.length?'':'<div class=emp>Нічого не знайдено</div>';
list.forEach(o=>{const d=document.createElement('div');d.className='op'+(o.selected?' on':'');d.innerHTML=(multi?'<i class=ck></i>':'')+'<span></span>';d.lastChild.textContent=o.textContent;
d.onclick=()=>{if(multi){o.selected=!o.selected;d.classList.toggle('on',o.selected)}else{s.value=o.value;w.classList.remove('open')}text();s.dispatchEvent(new Event('change',{bubbles:true}))};ol.appendChild(d)})};
dt.onclick=()=>{document.querySelectorAll('.dd.open').forEach(x=>x!==w&&x.classList.remove('open'));const o=w.classList.toggle('open');if(o){if(inp)inp.value='';draw();inp&&setTimeout(()=>inp.focus(),30)}};
