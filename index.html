<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель сервера</title>
<style>
:root{--bg:#0f1115;--p:#171a21;--p2:#1e222b;--bd:#262b36;--tx:#e6e8ee;--mu:#8b93a7;--ac:#5865f2;--g:#3ba55d;--r:#ed4245;--y:#faa61a;--pu:#b36bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--ac)}.m{color:var(--mu)}button,input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;background:var(--ac);border:0;font-weight:600}button.s{background:var(--p2);border:1px solid var(--bd)}button.d{background:var(--r)}button:hover{filter:brightness(1.1)}
textarea{width:100%;min-height:80px;resize:vertical}
#app{display:flex;min-height:100vh}aside{width:230px;background:var(--p);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px}aside h2 img{width:36px;height:36px;border-radius:50%}
nav button{background:none;text-align:left;width:100%;color:var(--mu);font-weight:500;border:0}nav button.on{background:var(--p2);color:var(--tx)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center}.me img{width:34px;height:34px;border-radius:50%}
main{flex:1;padding:24px;max-width:1100px;min-width:0}h1{margin:0 0 16px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:16px}.card b{font-size:26px;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.bar>*{flex:1 1 140px}
.ev{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--bd)}.ev:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--p2);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--mu)}
.ev .t{min-width:0;flex:1}.ev .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ev .h a{color:var(--tx);font-weight:600;cursor:pointer;text-decoration:none}
.ev .x{color:#c7cbd6;word-break:break-word;white-space:pre-wrap}
.bg{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}.bg.b{background:#5865f233;color:#a5adff}.bg.g{background:#3ba55d33;color:#6fdc8c}.bg.r{background:#ed424533;color:#ff8a8c}.bg.y{background:#faa61a33;color:#ffc766}.bg.p{background:#b36bff33;color:#d4a5ff}
.list{background:var(--p);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.mem .card{display:flex;gap:10px;align-items:center;cursor:pointer}.mem .card:hover{border-color:var(--ac)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.two .card{display:flex;flex-direction:column;gap:8px}.two h3{margin:0}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(720px,94vw);max-height:90vh;padding:20px}dialog::backdrop{background:#000a}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px;margin:2px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--g);padding:10px 16px;border-radius:10px;display:none;z-index:9}
.login{display:grid;place-items:center;min-height:100vh;text-align:center}.login .card{max-width:380px;padding:32px}
@media(max-width:760px){#app{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}nav{display:flex;flex-wrap:wrap}.me{margin:0 0 0 auto}main{padding:14px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const CFG={client:'1569374837523222549',api:'https://bot-for-log.duckdns.org'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=null,me=null,CH=[],RL=[];
(function(){try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){token=h.get('access_token');try{localStorage.setItem('tok',JSON.stringify({t:token,e:Date.now()+(+h.get('expires_in')||604800)*1000}))}catch{}history.replaceState(null,'',location.pathname)}
else{const s=JSON.parse(localStorage.getItem('tok')||'null');if(s&&s.e>Date.now())token=s.t}}catch{}})();
function logout(){try{localStorage.removeItem('tok')}catch{}token=null;location.reload()}
function loginUrl(){return'https://discord.com/api/oauth2/authorize?client_id='+CFG.client+'&response_type=token&scope=identify&redirect_uri='+encodeURIComponent(location.origin+location.pathname)}
async function api(p,body){const r=await fetch(CFG.api+p,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
const d=await r.json().catch(()=>({}));if(r.status===401){logout()}if(!r.ok)throw new Error(d.error||('Помилка '+r.status));return d}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.background=bad?'var(--r)':'var(--g)';e.style.display='block';setTimeout(()=>e.style.display='none',3500)}

const T={message_create:['Повідомлення','b'],message_edit:['Редагування','y'],message_delete:['Видалено','r'],message_bulk_delete:['Масове видалення','r'],channel_create:['Канал створено','g'],channel_delete:['Канал видалено','r'],channel_update:['Канал змінено','y'],role_create:['Роль створено','g'],role_delete:['Роль видалено','r'],role_update:['Роль змінено','y'],member_join:['Вхід','g'],member_leave:['Вихід','y'],member_kick:['Кік','r'],member_ban:['Бан','r'],member_unban:['Розбан','g'],nickname_change:['Нікнейм','y'],member_roles:['Ролі','b'],member_timeout:['Таймаут','y'],voice_join:['Голос: вхід','g'],voice_leave:['Голос: вихід','y'],voice_move:['Голос: перехід','b'],spam_violation:['Спам','r'],bot_start:['Запуск бота','g']};
const tl=t=>T[t]||[t.startsWith('admin_')?'Дія: '+t.slice(6):t,t.startsWith('admin_')?'p':'b'];
function desc(e){const d=e.details||{},ch=e.channel_name?'#'+e.channel_name:'',tg=e.target_name||'';
switch(e.type){case'message_create':return ch+': '+(d.content||'')+((d.attachments||[]).length?'\n📎 '+d.attachments.join('\n'):'');
case'message_edit':return ch+'\nБуло: '+(d.before||'')+'\nСтало: '+(d.after||'');
case'message_delete':return ch+': '+(d.content||'(вміст невідомий)')+(d.deletedBy?'\nВидалив: '+d.deletedBy:'');
case'message_bulk_delete':return ch+': '+d.count+' повідомлень';
case'channel_create':case'channel_delete':return ch+' ('+(d.kind||'')+')';
case'channel_update':return d.from+' → '+d.to;
case'role_create':case'role_delete':return tg;
case'role_update':return tg+(d.nameFrom!==d.nameTo?' (раніше '+d.nameFrom+')':'')+(d.permissionsChanged?' · змінено права':'');
case'member_join':return'Акаунт створено '+new Date(d.accountCreated).toLocaleDateString('uk-UA');
case'member_leave':return'';
case'member_kick':case'member_ban':case'member_unban':return tg+(d.reason?' · '+d.reason:'');
case'nickname_change':return tg+': '+(d.from||'—')+' → '+(d.to||'—');
case'member_roles':return tg+': '+((d.added||[]).length?'+'+d.added.join(', ')+' ':'')+((d.removed||[]).length?'−'+d.removed.join(', '):'');
case'member_timeout':return tg+(d.until?' до '+new Date(d.until).toLocaleString('uk-UA'):' · знято');
case'voice_join':case'voice_leave':return ch;case'voice_move':return d.from+' → '+d.to;
case'spam_violation':return d.messages+' повідомлень за '+d.windowSec+' с · '+d.action+(ch?' · '+ch:'');
case'bot_start':return'';}
const o={...d};delete o.via;return[tg,ch,Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · ')].filter(Boolean).join(' · ')}
function evRow(e){const[l,c]=tl(e.type);const av=e.actor_avatar?`<img class=av src="${esc(e.actor_avatar)}" loading=lazy alt="">`:`<div class=av>${esc((e.actor_name||'?')[0])}</div>`;
return`<div class=ev>${av}<div class=t><div class=h><a data-uid="${esc(e.actor_id||'')}">${esc(e.actor_name||(e.actor_id?'ID '+e.actor_id:'Система / невідомо'))}</a><span class="bg ${c}">${esc(l)}</span><span class=m>${new Date(e.ts).toLocaleString('uk-UA')}</span></div><div class=x>${esc(desc(e))}</div></div></div>`}
async function showEvents(box,p,more){const q=new URLSearchParams({limit:50,...p});if(more&&box.dataset.last)q.set('before',box.dataset.last);
const d=await api('/api/events?'+q);if(!more)box.innerHTML='';box.insertAdjacentHTML('beforeend',d.map(evRow).join('')||(more?'':'<p class=m style="padding:16px">Подій не знайдено</p>'));if(d.length)box.dataset.last=d[d.length-1].id;return d.length}
document.addEventListener('click',e=>{const a=e.target.closest('[data-uid]');if(a&&a.dataset.uid)profile(a.dataset.uid)});

const picker=id=>`<input id=${id} list=${id}L placeholder="Користувач (ім’я або ID)" autocomplete=off><datalist id=${id}L></datalist>`;
function bindPicker(id){const i=$('#'+id),l=$('#'+id+'L');let t;i.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(async()=>{if(i.value.length<2||i.value.includes('·'))return;try{const m=await api('/api/members?q='+encodeURIComponent(i.value));l.innerHTML=m.map(x=>`<option value="${esc(x.name)} · ${x.id}">`).join('')}catch{}},300)})}
const pid=id=>{const v=$('#'+id).value.trim();return v.includes('·')?v.split('·').pop().trim():(/^\d{15,}$/.test(v)?v:'')};
const chOpts=(txt)=>CH.filter(c=>!txt||c.text).map(c=>`<option value="${c.id}">#${esc(c.name)}</option>`).join('');
const main=h=>{$('#main').innerHTML=h};

const V={
async overview(){const s=await api('/api/stats');const c=(n,l)=>`<div class=card><b>${n}</b><span class=m>${l}</span></div>`;
main(`<h1>Огляд</h1><div class=grid>${c(s.members,'Учасників')}${c(s.channels,'Каналів')}${c(s.roles,'Ролей')}${c(s.events24h,'Подій за 24 год')}${c(s.events,'Подій усього')}${c(s.violations,'Порушень')}</div>
<div class=card style="margin-bottom:20px"><h3 style="margin-top:0">Активність за 24 год</h3>${s.byType24h.map(x=>`<span class=chip>${esc(tl(x.type)[0])}: <b>${x.c}</b></span>`).join('')||'<span class=m>Поки тихо</span>'}</div>
<h3>Останні події</h3><div class=list id=lst></div>`);showEvents($('#lst'),{})},
async log(){main(`<h1>Журнал подій</h1><form class=bar id=f><input name=q placeholder="Пошук у тексті"><select name=type><option value="">Усі типи</option>${Object.entries(T).map(([k,v])=>`<option value=${k}>${v[0]}</option>`).join('')}<option value="admin_*">Дії адмінів</option></select>${picker('u')}<select name=channel><option value="">Усі канали</option>${chOpts()}</select><input type=datetime-local name=from title="Від"><input type=datetime-local name=to title="До"><button>Шукати</button></form><div class=list id=lst></div><p><button class=s id=more>Показати ще</button></p>`);
bindPicker('u');const run=more=>{const f=new FormData($('#f')),p={};for(const[k,v]of f)if(v)p[k]=k==='from'||k==='to'?new Date(v).getTime():v;const u=pid('u');if(u)p.user=u;return showEvents($('#lst'),p,more)};
$('#f').onsubmit=e=>{e.preventDefault();run(false)};$('#more').onclick=()=>run(true);run(false)},
async members(){main(`<h1>Учасники</h1><form class=bar id=f><input name=q placeholder="Пошук за ім’ям"><button>Знайти</button></form><div class=mem id=mm></div>`);
const load=async q=>{const m=await api('/api/members?q='+encodeURIComponent(q||''));$('#mm').innerHTML=m.map(x=>`<div class=card data-uid=${x.id}><img class=av src="${esc(x.avatar)}" alt=""><div><b style="font-size:15px">${esc(x.name)}</b><br><span class=m>@${esc(x.username)}${x.bot?' · бот':''}</span></div></div>`).join('')};
$('#f').onsubmit=e=>{e.preventDefault();load(new FormData($('#f')).get('q'))};load('')},
async spam(){main(`<h1>Антиспам і порушення</h1><p class=m>Бот фіксує, якщо учасник надсилає багато повідомлень за кілька секунд, і видає короткий таймаут.</p><div class=list id=lst></div><p><button class=s id=more>Показати ще</button></p>`);
$('#more').onclick=()=>showEvents($('#lst'),{type:'spam_violation'},true);showEvents($('#lst'),{type:'spam_violation'})},
async control(){main(`<h1>Панель керування ботом</h1><div class=two>
<div class=card><h3>Написати від імені бота</h3><select id=sc>${chOpts(1)}</select><textarea id=st placeholder="Текст повідомлення"></textarea><button id=b1>Надіслати від імені бота</button></div>
<div class=card><h3>Видалити повідомлення</h3><select id=dc>${chOpts(1)}</select><input id=dm placeholder="ID повідомлення"><button class=d id=b2>Видалити</button></div>
<div class=card><h3>Очистити канал</h3><select id=pc>${chOpts(1)}</select><input id=pn type=number min=1 max=100 value=10><button class=d id=b3>Видалити останні N (до 100)</button></div>
<div class=card><h3>Дія над учасником</h3>${picker('mu')}<select id=ma><option value=timeout>Таймаут (хв, 0 = зняти)</option><option value=kick>Кік</option><option value=ban>Бан</option><option value=unban>Розбан (потрібен ID)</option><option value=roleAdd>Видати роль</option><option value=roleRemove>Забрати роль</option><option value=nickname>Змінити нікнейм</option></select><select id=mr>${RL.map(r=>`<option value=${r.id}>${esc(r.name)}</option>`).join('')}</select><input id=mp placeholder="Значення"><input id=mx placeholder="Причина (необов’язково)"><button id=b4>Виконати</button></div>
<div class=card><h3>Канали</h3><input id=cn placeholder="Назва нового каналу"><select id=ck><option value=text>Текстовий</option><option value=voice>Голосовий</option></select><button id=b5>Створити</button><select id=xc>${chOpts()}</select><button class=d id=b6>Видалити канал</button></div></div>
<h3>Історія адмін-дій</h3><div class=list id=lst></div>`);
bindPicker('mu');const hist=()=>showEvents($('#lst'),{type:'admin_*'});hist();
const run=async(n,b,ask)=>{if(ask&&!confirm(ask))return;try{await api('/api/actions/'+n,b);toast('Готово');hist()}catch(e){toast(e.message,1)}};
$('#b1').onclick=()=>run('send',{channelId:$('#sc').value,content:$('#st').value}).then(()=>$('#st').value='');
$('#b2').onclick=()=>run('deleteMessage',{channelId:$('#dc').value,messageId:$('#dm').value.trim()},'Видалити це повідомлення?');
$('#b3').onclick=()=>run('purge',{channelId:$('#pc').value,count:$('#pn').value},'Видалити останні '+$('#pn').value+' повідомлень?');
$('#b4').onclick=()=>{const a=$('#ma').value,u=pid('mu');if(!u)return toast('Оберіть учасника зі списку або вставте ID',1);const p=$('#mp').value,b={userId:u,reason:$('#mx').value};
if(a==='timeout')b.minutes=p;if(a==='nickname')b.nickname=p;if(a==='roleAdd'||a==='roleRemove')b.roleId=$('#mr').value;run(a,b,['kick','ban'].includes(a)?'Підтвердити: '+a+'?':'')};
$('#b5').onclick=()=>run('createChannel',{name:$('#cn').value,kind:$('#ck').value});
$('#b6').onclick=()=>run('deleteChannel',{channelId:$('#xc').value},'Видалити канал остаточно?')}};

async function profile(id){const d=$('#dlg');d.innerHTML='<p class=m>Завантаження…</p>';d.showModal();
try{const m=await api('/api/members/'+id),s=m.stats;d.innerHTML=`<div style="display:flex;gap:14px;align-items:center"><img class=av style="width:72px;height:72px" src="${esc(m.avatar)}" alt=""><div style="flex:1"><h2 style="margin:0">${esc(m.name)}</h2><span class=m>${esc(m.username||'')} · ID ${m.id}</span></div><button class=s onclick="$('#dlg').close()">Закрити</button></div>
<p class=m>${m.createdAt?'Акаунт: '+new Date(m.createdAt).toLocaleDateString('uk-UA'):''}${m.joinedAt?' · На сервері з '+new Date(m.joinedAt).toLocaleDateString('uk-UA'):''}${m.timeoutUntil?' · <b style="color:var(--y)">таймаут до '+new Date(m.timeoutUntil).toLocaleString('uk-UA')+'</b>':''}</p>
<p>${(m.roles||[]).map(r=>`<span class=chip style="border-color:${r.color}">${esc(r.name)}</span>`).join('')||'<span class=m>Без ролей</span>'}</p>
<div class=grid><div class=card><b>${s.messages}</b><span class=m>Повідомлень</span></div><div class=card><b>${s.edits}</b><span class=m>Редагувань</span></div><div class=card><b>${s.deletes}</b><span class=m>Видалень</span></div><div class=card><b>${s.violations}</b><span class=m>Порушень</span></div></div>
<h3>Остання активність</h3><div class=list style="max-height:340px;overflow:auto">${m.events.map(evRow).join('')||'<p class=m style="padding:12px">Немає подій</p>'}</div>`}catch(e){d.innerHTML='<p>'+esc(e.message)+'</p><button onclick="$(\'#dlg\').close()">Закрити</button>'}}

function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));V[v]().catch(e=>toast(e.message,1))}
async function start(){const root=$('#root');
if(!token){root.innerHTML=`<div class=login><div class=card><h2>Панель керування сервером</h2><p class=m>Увійдіть через Discord. Доступ мають лише дозволені акаунти.</p><a href="${loginUrl()}"><button>Увійти через Discord</button></a></div></div>`;return}
try{me=await api('/api/me')}catch(e){root.innerHTML=`<div class=login><div class=card><h2>Немає доступу</h2><p class=m>${esc(e.message)}</p><button onclick="logout()">Вийти</button></div></div>`;return}
const s=await api('/api/stats');[CH,RL]=await Promise.all([api('/api/channels'),api('/api/roles')]);
root.innerHTML=`<div id=app><aside><h2>${s.guild.icon?`<img src="${esc(s.guild.icon)}" alt="">`:''}${esc(s.guild.name)}</h2><nav>${[['overview','Огляд'],['log','Журнал'],['members','Учасники'],['spam','Антиспам'],['control','Керування']].map(([k,l])=>`<button data-v=${k}>${l}</button>`).join('')}</nav><div class=me><img src="${esc(me.avatar||'')}" alt=""><div><b>${esc(me.name)}</b><br><a href="#" onclick="logout();return false">Вийти</a></div></div></aside><main id=main></main></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));go('overview')}
start();
</script>
</body>
</html>
